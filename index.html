<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>♥ For You</title>

  <!-- Fonts: Caveat (handwritten messages) + Nunito (clean UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ============================================================
       LOADING SCREEN
       ============================================================ -->
  <div id="loading-screen" aria-label="Loading">
    <div class="loader-content">
      <svg class="loader-heart" viewBox="0 0 100 90" aria-hidden="true">
        <defs>
          <clipPath id="heart-clip">
            <path d="M50 85 C25 60, 0 40, 0 25 A25 25 0 0 1 50 15 A25 25 0 0 1 100 25 C100 40, 75 60, 50 85Z" />
          </clipPath>
        </defs>
        <path class="loader-heart-outline"
          d="M50 85 C25 60, 0 40, 0 25 A25 25 0 0 1 50 15 A25 25 0 0 1 100 25 C100 40, 75 60, 50 85Z" fill="none"
          stroke="#f4a0b5" stroke-width="2" />
        <rect class="loader-heart-fill" x="0" y="90" width="100" height="90" clip-path="url(#heart-clip)"
          fill="#f4a0b5" />
      </svg>
      <p class="loader-text">Preparing something special…</p>
      <p class="loader-percent">0 %</p>
    </div>
  </div>

  <!-- ============================================================
       ORIENTATION WARNING (portrait)
       ============================================================ -->
  <div id="orientation-warning" aria-label="Please rotate">
    <div class="rotate-icon">
      <svg viewBox="0 0 80 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect class="phone-body" x="15" y="10" width="50" height="90" rx="8" stroke="#f4a0b5" stroke-width="3"
          fill="none" />
        <circle cx="40" cy="90" r="4" fill="#f4a0b5" />
        <path class="rotate-arrow" d="M68 55 A30 30 0 0 1 40 115" stroke="#f4a0b5" stroke-width="2.5" fill="none"
          stroke-linecap="round" />
        <polygon points="36,113 44,117 40,108" fill="#f4a0b5" />
      </svg>
    </div>
    <p>Please rotate your phone to<br /><strong>landscape</strong> for the best experience 💕</p>
  </div>

  <!-- ============================================================
       INTRO SCREEN (envelope)
       ============================================================ -->
  <div id="intro-screen">
    <canvas id="intro-particles" aria-hidden="true"></canvas>

    <h1 class="intro-title" id="intro-title"></h1>

    <div class="envelope-wrapper" id="envelope">
      <!-- Envelope body -->
      <div class="envelope-body">
        <div class="envelope-letter">
          <span class="letter-name" id="letter-name"></span>
        </div>
      </div>
      <!-- Envelope flap (opens on tap) -->
      <div class="envelope-flap"></div>
      <!-- Front triangle -->
      <div class="envelope-front"></div>
    </div>

    <p class="tap-hint" id="tap-hint">
      <span class="heart-pulse">♥</span> Tap to open
    </p>
  </div>

  <!-- ============================================================
       SLIDESHOW CONTAINER (pages built by JS)
       ============================================================ -->
  <div id="slideshow" aria-live="polite"></div>

  <!-- ============================================================
       FINAL SCREEN
       ============================================================ -->
  <div id="final-screen">
    <canvas id="final-particles" aria-hidden="true"></canvas>
    <div class="final-content">
      <div class="big-heart" id="big-heart" aria-hidden="true"></div>
      <p class="final-message" id="final-message"></p>
      <p class="made-with-love" id="made-with-love"></p>
      <button class="replay-btn" id="replay-btn">
        <span class="replay-icon">♥</span> Go to start
      </button>
    </div>
  </div>

  <!-- ============================================================
       UI OVERLAYS (always visible during slideshow)
       ============================================================ -->
  <div id="ui-layer" class="hidden">
    <!-- Progress hearts -->
    <div id="progress-bar" aria-label="Progress"></div>

    <!-- Now-playing pill -->
    <div id="now-playing">
      <div class="vinyl" aria-hidden="true">
        <div class="vinyl-inner"></div>
      </div>
      <span class="np-title" id="np-title"></span>
      <span class="music-note" aria-hidden="true">♪</span>
    </div>

    <!-- Mute button -->
    <button id="mute-btn" aria-label="Toggle music">
      <svg class="speaker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5L6 9H2v6h4l5 4V5z" />
        <path class="speaker-waves" d="M19.07 4.93a10 10 0 0 1 0 14.14 M15.54 8.46a5 5 0 0 1 0 7.08" />
      </svg>
      <svg class="muted-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5L6 9H2v6h4l5 4V5z" />
        <line x1="23" y1="9" x2="17" y2="15" />
        <line x1="17" y1="9" x2="23" y2="15" />
      </svg>
    </button>

    <!-- Swipe hint (page 1 only) -->
    <div id="swipe-hint">
      <div class="swipe-hand"></div>
      <span>Swipe to turn the page</span>
    </div>

    <!-- Arrow buttons -->
    <button id="arrow-left" class="arrow-btn" aria-label="Previous page">‹</button>
    <button id="arrow-right" class="arrow-btn" aria-label="Next page">›</button>
  </div>

  <!-- Tap-hearts layer (hearts burst on tap) -->
  <canvas id="tap-canvas" aria-hidden="true"></canvas>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
